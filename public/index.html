<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="container">
        <div class="left-pane">
            <div id="terminal-placeholder">Send a message: a new container with its own Cline starts here.</div>
            <iframe id="terminal" title="Cline terminal" hidden></iframe>
        </div>
        <div class="right-pane">
            <div class="chat-header">
                <h2>Chats</h2>
                <div class="chat-settings">
                    <input type="password" id="api-key-input" placeholder="OpenRouter API key" class="input input-sm" />
                    <select id="proxy-country-select" class="input input-sm"></select>
                    <input type="text" id="model-input" placeholder="Model (optional)" class="input input-sm" />
                    <button id="save-settings-btn" class="btn btn-sm">Save Settings</button>
                </div>
                <button id="new-chat-btn" class="btn btn-primary">New Chat</button>
            </div>
            <div class="chat-sidebar"><div id="chat-list"></div></div>
            <div class="chat-area">
                <div id="chat-status"></div>
                <div id="chat-messages"></div>
                <form id="chat-form" class="flex">
                    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" class="input" />
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
